const ej_nombre=el=>el?.ejecutivo?.organizacion_nombre||null;
const ej_logo=el=>el?.ejecutivo?.organizacion_logo||null;

// El rótulo de la franja. Sale del cargo, no de un texto genérico: en una página
// de Lima decir «Electo» no dice qué se eligió.
const ROTULO={'GOBERNADOR REGIONAL':'Gobernador electo',
              'ALCALDE PROVINCIAL':'Alcalde provincial electo',
              'ALCALDE DISTRITAL':'Alcalde distrital electo'};

// Qué se sabe ya de la carrera, antes que nada. **Devuelve vacío si todavía no
// hay llamada**: una caja que dice «en disputa» ocupa el lugar de honor de la
// página para no decir nada, y en las 1,608 carreras sin resolver sería lo
// primero que se ve. Mientras no haya llamada, la página arranca por el
// escrutinio y los votos, que es lo que sí se sabe.
function desenlace(d, el, pr, porCod, orgEj){
  const caja=(rotulo, cuerpo, extra='')=>`<div class="desenlace">
    <div class="franja">${esc(rotulo)}${extra}</div>
    <div class="des-cuerpo">${cuerpo}</div></div>`;

  const tarjeta=o=>{
    const c=o?.candidato;
    registra(c, {nombre:o?.nombre, logo:o?.logo});
    return `<div class="des-card">
      <div class="aut aut-g" style="border:0;padding:2px 0">
        <img class="aut-logo" src="${esc(o?.logo||'')}" alt="" loading="lazy"
          onerror="this.style.visibility='hidden'">
        <img class="aut-foto" src="${esc(c?.foto||'')}" alt="" loading="lazy"
          onerror="this.style.visibility='hidden'">
        <div class="ident">
          <b class="cand-nom">${esc(c?.nombre||'—')}</b>
          <span class="part-nom">${esc(o?.nombre||'')}</span>
          <span class="des-pct">${P(o.pct_validos)} · ${F(o.votos)} votos</span>
          <span class="des-hdv">${botonHdv(c)}</span>
        </div></div></div>`;
  };

  // Ganador proclamado por la proyección. Solo el titular: el acompañante no es
  // la noticia y sale igual en «Autoridades electas».
  if(pr.estado==='electo' && el?.ejecutivo?.titular?.length){
    const o=porCod[el.ejecutivo.organizacion];
    if(!o) return '';
    const c=el.ejecutivo.titular[0];
    registra(c, orgEj);
    return caja(ROTULO[el.ejecutivo.cargo] || (el.ejecutivo.cargo+' electo'),
      `<div class="des-card">
        <div class="aut aut-g" style="border:0;padding:2px 0">
          <img class="aut-logo" src="${esc(orgEj.logo||'')}" alt="" loading="lazy"
            onerror="this.style.visibility='hidden'">
          <img class="aut-foto" src="${esc(c.foto||'')}" alt="" loading="lazy"
            onerror="this.style.visibility='hidden'">
          <div class="ident">
            <b class="cand-nom">${esc(c.nombre)}</b>
            <span class="part-nom">${esc(orgEj.nombre||'')}</span>
            <span class="des-pct">${P(o.pct_validos)} · ${F(o.votos)} votos</span>
            <span class="des-hdv">${botonHdv(c)}</span>
          </div></div></div>`);
  }

  // Segunda vuelta proyectada: los dos que pasan.
  if(pr.estado==='segunda_vuelta' && (pr.quienes||[]).length){
    const pasan=pr.quienes.map(c=>porCod[c]).filter(Boolean)
      .sort((a,b)=>b.pct_validos-a.pct_validos);
    if(!pasan.length) return '';
    return caja('Habrá segunda vuelta',
      `<div class="des-par">`+pasan.map(tarjeta).join('')+`</div>`,
      `<span class="franja-sub">P(hay segunda vuelta) ${P(pr.p_segunda_vuelta)}</span>`);
  }

  // Empate: también es una llamada, y una que dispara sorteo.
  if(pr.estado==='empate' && (pr.quienes||[]).length){
    const emp=pr.quienes.map(c=>porCod[c]).filter(Boolean);
    if(!emp.length) return '';
    return caja('Empate — va a sorteo',
      `<div class="des-par">`+emp.map(tarjeta).join('')+`</div>`);
  }

  return '';   // sin llamada, sin caja
}

// Una autoridad electa es una persona **y** un partido, y las dos cosas se leen
// en la misma fila: logo, cara, nombre arriba y partido debajo. Antes el partido
// era un encabezado y las personas colgaban de él, lo que obligaba a mirar hacia
// arriba para saber por quién entró cada uno.
// `porQue` es la circunscripción por la que entra, y solo la tienen los cuerpos
// que se eligen por partes: un consejero regional representa a una provincia y
// un regidor no representa a nada más chico que su concejo.
function fichaAutoridad(c, org, grande=false, porQue=null){
  const vacia = !c;
  if(c) registra(c, org);
  const info=!c?'':[c.dni?'DNI '+esc(c.dni):'', c.edad?c.edad+' años':'',
    c.sentencias_penales?`<b>${c.sentencias_penales} sentencia(s) penal(es)</b>`:'']
    .filter(Boolean).join(' · ');
  return `<div class="aut${grande?' aut-g':''}">
    ${org?.logo?`<img class="aut-logo" src="${esc(org.logo)}" alt="" loading="lazy"
      onerror="this.style.visibility='hidden'">`:'<span class="aut-logo"></span>'}
    ${c?`<img class="aut-foto" src="${esc(c.foto||'')}" alt="" loading="lazy"
      onerror="this.style.visibility='hidden'">`:'<span class="aut-foto"></span>'}
    <div class="ident">
      <b class="cand-nom">${vacia?'<span class="pordef">EN DISPUTA</span>':esc(c.nombre)}</b>
      ${porQue?`<span class="por-que">${esc(porQue)}</span>`:''}
      <span class="part-nom">${esc(org?.nombre||'—')}</span>
      ${info?`<span class="m">${info}</span>`:''}
    </div>
    <span style="margin-left:auto">${c?botonHdv(c):''}</span></div>`;
}

async function vistaCarrera(rid){
  // El consejo regional se elige por circunscripción, pero no es una página:
  // es una sección de la página de su región. Llegar a `#/c/02-XXXXXX` daba una
  // página huérfana, sin ejecutivo y sin contexto.
  if(rid.startsWith('02-')){ location.replace('#/c/01-'+rid.slice(3,5)+'0000'); return }
  let d; try{ d=await j(`carrera/${rid}.json`) }
  catch(e){ $('vista').innerHTML=`<div class="aviso">No hay datos para
    <code>${esc(rid)}</code>. <a href="#/">Volver al resumen</a>.</div>`; return }

  const co=d.computo||{}, pr=d.pronostico||{}, el=d.electos||{};
  const nombres={}; (d.organizaciones||[]).forEach(o=>nombres[o.codigo]=o.nombre);

  RACE_ACTUAL=rid;
  const porCod={}; (d.organizaciones||[]).forEach(o=>porCod[o.codigo]=o);
  const orgEj={nombre:ej_nombre(el), logo:ej_logo(el)};

  cabecera();
  let h=`<a class="volver" href="#/">← Resumen nacional</a>
    <h1 style="margin-top:6px">${esc(d.nombre)}</h1>
    <div class="sub">${NIVEL[d.tipo]||d.tipo}</div>`;

  // --- 0. El desenlace, si ya lo hay. Lo que la gente entra a averiguar va
  // primero; estaba al pie, debajo del mapa y de la tabla de votos.
  // Anulada: la caja lo dice y la página sigue mostrando a los candidatos con
  // cero votos. Una página vacía no distinguiría «todavía no sabemos» de «no hubo
  // elección que contar», que es justo lo que hay que separar.
  h+= d.anulada
    ? `<div class="desenlace"><div class="franja">ELECCIÓN ANULADA</div>
       <div class="des-cuerpo"><p style="margin:0">Todas las actas fueron
       anuladas.</p></div></div>`
    : desenlace(d, el, pr, porCod, orgEj);

  // El avance del escrutinio de **esta** elección va siempre, haya llamada o no:
  // es lo que le da sentido a todo lo demás de la página. La barra de arriba
  // lleva el del país entero, que es otra cosa.
  h+=`<div class="avance-caja">
    <div class="e">ACTAS CONTABILIZADAS ·
      <b>${co.actas_esperadas?P(co.pct_actas):'—'}</b>
      ${co.actas_esperadas?`· ${F(co.actas_contabilizadas)} de ${F(co.actas_esperadas)}`:''}</div>
    <div class="riel"><i style="width:${(100*(co.pct_actas||0)).toFixed(1)}%"></i></div>
    </div>`;

  // --- 1. cómputo
  h+=`<h2>Resultados</h2>
    <div class="marcador">
    <div class="tile"><div class="k">${F(co.votos_validos)}</div><div class="e">Válidos</div></div>
    <div class="tile"><div class="k">${F(co.votos_blancos)}</div><div class="e">Blancos</div></div>
    <div class="tile"><div class="k">${F(co.votos_nulos)}</div><div class="e">Nulos</div></div>
    <div class="tile"><div class="k">${F(co.votos_impugnados)}</div><div class="e">Impugnados</div></div>
    <div class="tile"><div class="k">${F(co.votos_emitidos)}</div><div class="e">Votos emitidos</div></div>
    <div class="tile"><div class="k">${F(co.electores_habiles)}</div><div class="e">Electores hábiles</div></div>
    </div>`;

  // --- 2. proyección
  const orgs=d.organizaciones||[];
  // Cinco filas y el resto plegado. En ERM 2026 hay circunscripciones con más de
  // veinte listas, y una tabla de veinte filas entierra todo lo que viene debajo.
  const VISIBLES=5;
  const mx=Math.max(...orgs.map(o=>o.pct_validos||0),0.0001);
  // En gobernador, «quién va primero» no es la pregunta: si la segunda vuelta es
  // segura, el puntero gana un torneo que no existe. Las preguntas son ganar en
  // primera (superar el umbral) y clasificar entre los dos. Se muestran aparte,
  // con P(hay segunda vuelta) encabezando la columna a la que condiciona.
  const dosVueltas = d.tipo==='01' && pr.p_segunda_vuelta!=null;
  // En las circunscripciones muy chicas el forecaster no encuentra un nivel con
  // suficientes mesas contadas y recurre a un prior de respaldo: da
  // probabilidades, con banda ancha, pero no piso garantizado ni llamada. Hay
  // que decirlo, o una probabilidad de respaldo se lee como una normal.
  const respaldo = !!pr.respaldo;
  const sinProyeccion = orgs.length && orgs.every(o=>!(o.p_gana>0) &&
    !(o.p_primera>0) && !(o.p_segunda>0));
  h+=`<h2>Proyección</h2>`;
  if(!d.anulada && sinProyeccion) h+=`<div class="aviso">Todavía no hay proyección para esta
    elección. Con ${F(co.actas_contabilizadas)} de ${F(co.actas_esperadas)} actas
    no hay base suficiente para estimar; los votos de abajo son el cómputo
    oficial, no un pronóstico.</div>`;
  else if(respaldo) h+=`<div class="aviso">Proyección preliminar. Con
    ${F(co.actas_contabilizadas)} de ${F(co.actas_esperadas)} actas no hay
    suficientes mesas comparables, así que las probabilidades se estiman sobre lo
    contado aquí mismo y llevan mucha más incertidumbre de lo habitual. Esta
    elección no se dará por definida con esta base.</div>`;
  h+=`<div class="envuelve"><table><thead><tr><th>Organización</th>
      <th class="n">Votos</th><th class="n">%</th><th style="width:26%"></th>`+
    (sinProyeccion ? ''
      : dosVueltas
      ? `<th class="n">P(gana en 1.ª)</th><th class="n">P(pasa a 2.ª)</th>`
      : `<th class="n">P(gana)</th>`)+
    `</tr></thead><tbody>`+
    orgs.map((o,i)=>`<tr${i>=VISIBLES?' class="mas" hidden':''}>
      <td><span class="org">
        ${burbuja(o.codigo)}
        <img class="logo" src="${esc(o.logo||'')}" alt="" loading="lazy"
          onerror="this.style.visibility='hidden'">
        <img class="carita" src="${esc(o.candidato?.foto||'')}" alt="" loading="lazy"
          onerror="this.style.visibility='hidden'">
        <span class="ident">
          <b class="cand-nom">${esc(o.candidato?.nombre||'—')}</b>
          <span class="part-nom">${esc(o.nombre)}</span>
        </span></span></td>
      <td class="n">${F(o.votos)}</td><td class="n">${P(o.pct_validos)}</td>
      <td><span class="barra" style="width:${(100*(o.pct_validos||0)/mx).toFixed(1)}%;
        background:${colorDe(o.codigo)}"></span></td>`+
      (sinProyeccion ? ''
        : dosVueltas
        ? `<td class="n">${o.p_primera>0?P(o.p_primera):'—'}</td>
           <td class="n">${o.p_segunda>0?P(o.p_segunda):'—'}</td>`
        : `<td class="n">${o.p_gana>0?P(o.p_gana):'—'}</td>`)+
      `</tr>`).join('')+`</tbody></table></div>`+
    (orgs.length>VISIBLES
      ? `<button class="ver-mas" aria-expanded="false">Ver las ${
          orgs.length-VISIBLES} restantes</button>` : '');

  // --- mapa desagregado, con selector de nivel dentro del mapa
  const niveles=d.desagregado_niveles||{};
  const ETIQ_NIV={provincia:'Por provincia', distrito:'Por distrito',
                  local:'Por local'};
  // Qué archivo de geografía corresponde a cada nivel **depende del tipo de
  // carrera**, no solo del nombre del nivel: en gobernador el recorte base son
  // las provincias del departamento y los distritos van en el `-dist`; en una
  // provincial el recorte base ya son los distritos. Suponer un mapeo único dejó
  // sin mapa a las 196 provinciales y a las 1,694 distritales.
  const GEO_NIV = d.tipo==='01'
    ? {provincia:`geo/${rid}.geojson`, distrito:`geo/${rid}-dist.geojson`}
    : {distrito:`geo/${rid}.geojson`};
  // Una carrera distrital se desagrega por local de votación y de los locales no
  // hay geometría. Se pinta el distrito entero con quien puntea en la carrera:
  // no es un coropleto —hay una sola pieza— pero ubica de qué distrito se habla,
  // que es la mitad de para qué sirve el mapa.
  if(d.tipo==='04' && !niveles.distrito){
    const tot={};
    for(const u of niveles.local||[])
      for(const [c,v] of Object.entries(u.votos||{})) tot[c]=(tot[c]||0)+v;
    if(Object.keys(tot).length)
      niveles.distrito=[{ubigeo:d.ubigeo, pct_actas:co.pct_actas, votos:tot}];
  }
  const dispo=Object.keys(niveles).filter(k=>GEO_NIV[k] && (niveles[k]||[]).length);
  if(dispo.length){
    h+=`<h2>Mapa</h2>
      <div class="mapa" id="mapaC"></div><div id="leyC"></div>`;
    setTimeout(async()=>{
      const cont=$('mapaC'); if(!cont) return;
      let m=null, capa=null;
      // Quién gana en cada unidad, a un nivel dado. La carrera se adjudica en la
      // circunscripción entera; esto es solo dónde va ganando cada quien.
      const ganadorEn=nivel=>{
        const g={};
        for(const u of niveles[nivel]||[]){
          let mx=-1, q=null;
          for(const [c,v] of Object.entries(u.votos||{})) if(v>mx){mx=v;q=c}
          g[u.ubigeo]={q, pct:u.pct_actas};
        }
        return g;
      };
      // Mismo esqueleto de tooltip que en el mapa nacional: unidad, avance del
      // escrutinio, y recién después la persona y su organización. El nombre del
      // partido solo obliga a otro salto para saber a quién se está votando.
      const fichaOrg={}; (d.organizaciones||[]).forEach(o=>fichaOrg[o.codigo]=o);
      let borde=null;
      // Qué nivel dibuja las fronteras de referencia sobre cada vista. En una
      // regional vista por distrito son las provincias; vista por provincia, la
      // pieza ya **es** la provincia y no hace falta nada encima.
      const CONTORNO_DE={distrito: d.tipo==='01' ? `geo/${rid}.geojson` : null};
      async function pinta(nivel){
        try{
          const gj=await j(GEO_NIV[nivel]);
          const gan=ganadorEn(nivel);
          if(!m){
            m=creaMapa(cont);
            if(dispo.length>1)
              controlNiveles(m, dispo.map(k=>[k,ETIQ_NIV[k]||k]), nivel, pinta);
          }
          if(capa) m.removeLayer(capa);
          if(borde){ m.removeLayer(borde); borde=null; }
          const marcas=new Set();
          capa=agregaCapa(m, gj, u=>{
            const x=gan[u];
            if(!x||!x.q){ marcas.add('sin_actas');
              return {color:css('--vacio'),
                      texto:`<span class="tt-est">SIN ACTAS</span>`}; }
            const o=fichaOrg[x.q]||{};
            return {color:colorDe(x.q),
              texto:`<span class="tt-est">${P(x.pct)} de actas contabilizadas</span>`+
                `<span class="tt-cand">${esc(o.candidato?.nombre||'—')}</span>`+
                `<span class="tt-org">${esc(nombres[x.q]||x.q)}</span>`};
          }, {peso: nivel==='distrito' && dispo.length>1 ? .55 : 1.3});
          if(CONTORNO_DE[nivel]) borde=await contorno(m, CONTORNO_DE[nivel], 1.6);
          const l=$('leyC'); if(l) l.innerHTML=leyendaEstados(marcas);
        }catch(e){ if(!m){ cont.remove(); const l=$('leyC'); if(l) l.remove(); } }
      }
      pinta(dispo.includes('provincia')?'provincia':dispo[0]);
    },0);
  }

  // --- 3. autoridades electas. SIEMPRE, desde el corte cero.
  h+=`<h2>Autoridades electas</h2>`;
  const ej=el.ejecutivo;
  // Una autoridad electa es persona **y** partido. Con la cara sola no se sabe
  // qué ganó la elección, que es la mitad de la noticia.
  if(ej&&ej.cargo){
    h+=`<div class="fila"><b>${esc(ej.cargo)}</b>
      <span class="chip ${ej.estado==='electo'?'si':''}">${etiq(ej.estado)}</span></div>`;
    const orgEj={nombre:ej.organizacion_nombre, logo:ej.organizacion_logo};
    h+= (ej.titular&&ej.titular.length)
      ? ej.titular.map(c=>fichaAutoridad(c, orgEj, true)).join('')
      : `<div class="aut aut-g"><span class="aut-foto"></span>
         <span class="pordef">EN DISPUTA</span></div>`;
    if(ej.cargo_acompanante){
      h+=`<div class="fila"><b>${esc(ej.cargo_acompanante)}</b></div>`;
      // Si el ejecutivo ya está electo y no hay acompañante, la carrera no está
      // «en disputa»: la candidatura se cayó —exclusión, renuncia o tacha— y la
      // lista ganó sin ella. Pasó en Huánuco y Ucayali en 2022.
      h+= (ej.acompanante&&ej.acompanante.length)
        ? ej.acompanante.map(c=>fichaAutoridad(c, orgEj, true)).join('')
        : `<div class="aut aut-g"><span class="aut-foto"></span>
           <span class="pordef">${ej.estado==='electo'
             ? 'SIN CANDIDATO INSCRITO — LA CANDIDATURA NO LLEGÓ A LA ELECCIÓN'
             : 'EN DISPUTA'}</span></div>`;
    }
  }
  const cu=el.cuerpo;
  if(cu&&cu.n_escanos){
    h+=`<div class="fila" style="border-bottom:0;margin-top:10px">
      <b>${esc(cu.cargo)}</b><span class="sub">${cu.adjudicados} DE ${cu.n_escanos}
      ADJUDICADOS${cu.en_disputa?` · ${cu.en_disputa} EN DISPUTA`:''}</span></div>`;

    // Un concejo municipal es tan colegiado como un consejo regional: se dibuja
    // igual, bancadas primero y en disputa al final.
    const bancadasM=(cu.por_organizacion||[]).map(o=>({
      codigo:o.codigo, escanos:o.escanos, nombre:o.nombre}));
    h+=hemiciclo(bancadasM, cu.en_disputa, colorDe)+
       leyendaBancadas(bancadasM, cu.en_disputa, colorDe);
    // Los cuerpos proporcionales sí se leen como tabla: una fila por persona,
    // en el orden del reparto.
    // Si una organización se lleva más escaños que candidatos tenemos en el
    // registro, el hueco se declara. Callarlo dejaba un concejo donde el
    // hemiciclo mostraba cinco escaños llenos y la lista nombraba a cuatro.
    // Pasó una vez en 2022 —Pucará, Puno: el registro del JNE no traía la lista
    // de MIRA, que sin embargo sacó un regidor—, y es justo el tipo de hueco
    // que aparece cuando una lista se inscribe tarde.
    h+= (cu.por_organizacion||[]).flatMap(o=>{
      const cs=o.candidatos||[];
      const filas=cs.map(c=>fichaAutoridad(c, o));
      for(let i=cs.length;i<(o.escanos||0);i++)
        filas.push(`<div class="aut"><span class="aut-logo"></span>
          <span class="aut-foto"></span><div class="ident">
          <b class="cand-nom"><span class="pordef">CANDIDATO NO DISPONIBLE</span></b>
          <span class="part-nom">${esc(o.nombre)}</span>
          <span class="m">El escaño está adjudicado; la lista no figura en el
            registro de candidaturas.</span></div></div>`);
      return filas;
    }).join('');
    if(cu.en_disputa>0){
      h+=`<div class="aut"><span class="aut-foto"></span>
        <span class="pordef">${cu.en_disputa} ESCAÑO(S) EN DISPUTA</span></div>`;
    }
  }
  if(!ej?.cargo && !cu?.n_escanos) h+=`<div class="aviso">Esta carrera no elige
    autoridades propias.</div>`;

  // --- consejo regional (solo página regional)
  if(d.consejo){
    // Primero el cuerpo entero de un vistazo —cuántos escaños y de quién—, y
    // recién después quién ocupa cada uno. El consejo es un órgano colegiado:
    // la composición es la noticia; los nombres, el detalle.
    const todos=[];
    for(const x of d.consejo.circunscripciones)
      for(const e of x.escanos) todos.push({...e, provincia:x.nombre});
    // La paleta del consejo es la del propio consejo, no la de la carrera de
    // gobernador: son votaciones distintas y los punteros no tienen por qué
    // coincidir.
    const cuenta={};
    for(const e of todos) if(e.organizacion) cuenta[e.organizacion]=(cuenta[e.organizacion]||0)+1;
    const topC=Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a]);
    const colC=colorDe;

    const bancadasC=topC.map(c=>({codigo:c, escanos:cuenta[c],
      nombre:(todos.find(e=>e.organizacion===c)||{}).nombre||c}));
    const disputaC=d.consejo.n_escanos-d.consejo.adjudicados;
    // Orden de lectura: primero la composición del cuerpo, que es la noticia;
    // después dónde se eligió cada escaño; al final quién lo ocupa.
    h+=`<h2>Consejo regional — ${d.consejo.adjudicados} de ${d.consejo.n_escanos}</h2>`+
      hemiciclo(bancadasC, disputaC, colC)+
      leyendaBancadas(bancadasC, disputaC, colC)+
      `<div class="mapa" id="mapaK" style="margin-top:10px"></div>`;
    // El consejo se elige por circunscripción, así que su mapa es otro: quién
    // puntea en cada provincia, con los escaños que le tocan dibujados encima.
    setTimeout(async()=>{
      const cont=$('mapaK'); if(!cont) return;
      try{
        const gj=await j(`geo/02-${d.ubigeo.slice(0,2)}0000.geojson`);
        const porU={};
        for(const x of d.consejo.circunscripciones) porU[x.ubigeo]=x;
        const m=creaMapa(cont);
        agregaCapa(m, gj, u=>{
          const x=porU[u];
          if(!x||!x.lider) return {color:css('--vacio'),
            texto:`<span class="tt-est">SIN ACTAS</span>`};
          const ganados=(x.escanos||[]).filter(e=>e.organizacion===x.lider).length;
          return {color:colC(x.lider),
            texto:`<span class="tt-est">${P(x.pct_actas)} de actas · ${x.n_escanos} ESCAÑO(S)</span>`+
              `<span class="tt-cand">${ganados} de ${x.n_escanos}</span>`+
              `<span class="tt-org">${esc(x.lider_nombre||x.lider)}</span>`};
        }, {peso:1.3});
        for(const x of d.consejo.circunscripciones){
          if(!x.centroide) continue;
          const bolas=x.escanos.map(e=>`<i style="background:${
            e.organizacion?colC(e.organizacion):css('--vacio')}"></i>`).join('');
          L.marker([x.centroide[1], x.centroide[0]], {interactive:false,
            icon:L.divIcon({className:'escanos-mapa', html:`<div>${bolas}</div>`,
                            iconSize:null})}).addTo(m);
        }
      }catch(e){ cont.remove() }
    },0);

    h+=todos.map(e=>fichaAutoridad(e.consejero, {nombre:e.nombre, logo:e.logo},
                                    false, e.provincia)).join('');
  }
  $('vista').innerHTML=h;
}

// -------------------------------------------------------------------- rutas
async function enruta(cambioDeRuta=true){
  const r=location.hash.replace(/^#/,'')||'/';
  const mismaRuta = r===RUTA_ACTUAL;
  RUTA_ACTUAL=r;
  const m=r.match(/^\/c\/([0-9]{2}-[0-9]{6})$/);
  document.querySelectorAll('.mode-tab').forEach(a=>{
    if(a.dataset.r===r) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  // Solo se sube al inicio cuando de verdad cambias de página. Un refresco del
  // sondeo repinta la misma vista, y mandar al tope cada 45 segundos a quien
  // está leyendo la tabla de regidores hace la página inusable justo la noche
  // en que más se lee.
  const y = (cambioDeRuta && !mismaRuta) ? 0 : scrollY;
  if(m){ await vistaCarrera(m[1]); }
  else if(r==='/reeleccion'){ await vistaTenientes(); }
  else if(r==='/buscador'){ await vistaBuscador(); }
  else { await vistaNacional(); }
  scrollTo(0, y);
}

// --------------------------------------------------- sondeo con jitter
// Intervalo configurable por querystring (?cada=20) para poder bajarlo en el
// ensayo. El jitter evita que 20,000 clientes pidan en el mismo segundo: sin
// él, el patrón de carga son picos sincronizados cada N segundos.
const PARAMS=new URLSearchParams(location.search);
const CADA=Math.max(5,+(PARAMS.get('cada')||45))*1000;
const JITTER=0.35;
let timer=null;

function proximo(){
  if(REPLAY){ const v=$('vivo'); if(v) v.hidden=true; return }
  const espera=CADA*(1+(Math.random()*2-1)*JITTER);
  clearTimeout(timer);
  timer=setTimeout(refresca, espera);
  $('sondeo').textContent=`actualiza cada ~${Math.round(CADA/1000)} s`;
  $('pulso').className='pulso on';
}
async function refresca(){
  if(REPLAY) return;
  if(document.hidden){ proximo(); return }   // pestaña en segundo plano: no pedir
  try{
    const nuevo=await j('nacional.json');
    const cambio=!NAC||nuevo.generado!==NAC.generado;
    NAC=nuevo; cabecera();
    if(cambio) await enruta(false);
  }catch(e){
    $('pulso').className='pulso off';
    $('sondeo').textContent='sin conexión — reintentando';
  }
  proximo();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresca() });

// La barra de arriba **no cambia nunca**: es el marcador de las ERM 2022 enteras
// —cuántas elecciones hay, cuánto se ha contado del país, cuánta gente votó— y se
// lee igual en el resumen que dentro de una contienda. Lo de *esta* contienda
// (su nombre, su avance) vive en su página, que es donde significa algo. Cuando
// la barra cambiaba al navegar, el mismo sitio mostraba dos magnitudes distintas
// sin decir cuál, y no se sabía si el 100% era del país o del distrito.
function cabecera(){
  const c = {pct_actas:NAC.pct, electores_habiles:NAC.electores_habiles,
             votos_emitidos:NAC.votos_emitidos};
  // Porcentaje y recuento, nada más. Antes esta zona llevaba además cuántas
  // elecciones hay y cuántas tienen resultado, que es otra cosa —el marcador de
  // la noche, no el avance del escrutinio— y ya se lee entero en «Estado».
  $('avance').textContent = NAC.actas_esperadas
    ? `${P(c.pct_actas)} · ${F(NAC.actas_contabilizadas)}/${F(NAC.actas_esperadas)}`
    : P(c.pct_actas);
  $('avanceBarra').style.width=(100*(c.pct_actas||0)).toFixed(1)+'%';
  // La participación se mide contra el padrón **escrutado**, no contra el del
  // país: si no, a mitad de noche saldría 39% y se leería como abstención.
  const part = NAC.participacion!=null ? NAC.participacion : null;
  const st=(l,v,hi)=>`<div class="hstat"><span class="hstat-lab">${l}</span>
    <span class="hstat-val${hi?' hi':''}">${v}</span></div>`;
  $('cabStats').innerHTML =
    st('Electores', F(c.electores_habiles||0))+
    st('Votos emitidos', F(c.votos_emitidos||0))+
    st('Participación', part!=null?P(part):'—', true);
}

// -------------------------------------------------------------------- inicio
addEventListener('hashchange',enruta);
(async()=>{
  try{
    [META,NAC,COLORES]=await Promise.all([j('meta.json'), j('nacional.json'),
      j('colores.json').catch(()=>({}))]);
    REPLAY = META.proceso === 'ERM2022';
    // El tablero de reelección es un producto de ERM 2026: los 135 casos salen
    // de su registro de candidaturas. En 2022 la pestaña abriría un aviso de
    // «todavía no hay», que es peor que no ofrecerla.
    if(META.proceso !== 'ERM2026'){
      const t=document.querySelector('.mode-tab[data-r="/reeleccion"]');
      if(t) t.remove();
    }
    const anio = String(META.proceso||'').replace(/\D/g,'') || '';
    if(anio){
      document.title = `Perú — ERM ${anio} | Datapol`;
      $('cabTitulo').textContent = `🇵🇪 ERM ${anio} · PERÚ`;
    }
    cabecera(); await enruta(); proximo();
  }catch(e){
    $('vista').innerHTML=`<div class="aviso">No se pudieron cargar los datos.
      <code>${esc(e.message)}</code></div>`;
  }
})();
</script></body></html>
