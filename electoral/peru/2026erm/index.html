<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perú — ERM 2022 | Datapol</title>
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<!-- El traductor de Chrome se ofrece en cualquier página y aquí destroza lo que
     más importa: nombres propios. Convertía Castilla en «CASTILLE», «EN DISPUTA»
     en «IN DISPUTE» y hasta inventaba palabras («Busca una contaenda»). Son
     nombres de distritos y de organizaciones peruanas: no hay traducción
     correcta, solo ruido. -->
<meta name="google" content="notranslate">
<link rel="stylesheet" href="/shared/nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Paleta categórica validada (referencia dataviz). Un coropleto compara todos
   los pares a la vez, no solo los adyacentes, y bajo esa regla solo los tres
   primeros slots pasan los umbrales de CVD en ambos modos. Por eso el mapa
   pinta TRES organizaciones y pliega el resto en «Otras»: no es una decisión
   estética, es el límite hasta donde los colores se distinguen. */
:root{
  color-scheme:light;
  /* Los seis primeros son los de datapol.lat, copiados tal cual desde
     `electoral/peru/2026eg/segunda-vuelta`. El resto los deriva esta página. */
  --fondo:#f5f0e8; --panel:#ede8df; --tinta:#1a1209; --suave:#7a6858;
  --tenue:#b0a090; --linea:#cfc0ab; --linea-fuerte:#bfb0a0;
  --terra:#c4603a; --terra-dk:#8b3c1f; --terra-lt:#f0e4d8; --arena:#d9c9b4;
  /* Estados. El acento de la casa es la terracota, así que «electo» va en verde
     oliva y no en el verde frío de antes, que sobre crema chillaba. */
  --ok:#5c6b2f; --espera:#a8791f; --disputa:#b0a090;
  --otras:#8a7a68; --vacio:#e3dbcd; --segunda:#9a8a78; --regional:#8a6522;
  --empate:#5f5348; --anulada:#cbb89d;
  --s1:#2e6b9e; --s2:#c4603a; --s3:#5c6b2f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:13.5px/1.55 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
/* ESCALA TIPOGRÁFICA: todo el cuerpo se redujo un 10% sobre el tamaño original,
   con suelo de 9 px para que los rótulos pequeños sigan siendo legibles. Si hace
   falta volver a moverlo, es proporcional sobre TODOS los `font-size` de esta
   hoja, no ajustar unos cuantos a ojo: tocar solo algunos desordena la jerarquía
   entre títulos, tablas y rótulos, que es lo que hace que la página se lea.
   Bebas para los títulos y las cifras grandes, que es la voz de la casa. El
   cuerpo se queda en 13.5 px y no en los 12 de datapol: aquella es una página que
   se escanea y esta se lee —nombres, hojas de vida, listas de regidores—. */
.display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;
  font-weight:400;line-height:1}
.env{max-width:1000px;margin:0 auto;padding:16px 16px 80px}
a{color:inherit}
/* El nombre de la carrera es la identidad de la página y estaba más chico que
   el porcentaje de actas. Y los encabezados de sección a 12 px no separaban
   nada: una página de carrera tiene cinco bloques y hay que verlos. */
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:41.5px;margin:0 0 2px;
   letter-spacing:.02em;line-height:1;font-weight:400}
h2{font-family:'Bebas Neue',Impact,sans-serif;font-size:23.5px;font-weight:400;
   margin:38px 0 12px;letter-spacing:.03em;line-height:1;text-transform:uppercase;
   color:var(--tinta);border-left:0;padding:0 0 7px;
   border-bottom:2px solid var(--tinta)}
h2 .sec{font-family:inherit;color:var(--suave);font-size:.7em}
@media(max-width:560px){h1{font-size:30.5px}}
.sub{color:var(--suave);font-size:11.5px}

/* --- barra superior: estado del cómputo y del sondeo --- */
/* Barra negra + barra de modos + cabecera densa: la misma estructura que
   `electoral/peru/2026eg/segunda-vuelta`. El título, el avance del escrutinio y
   los totales viven aquí, no repartidos entre la cabecera y el cuerpo. */
/* La barra negra ya no se imita: viene de `/shared/nav.css` y `/shared/nav.js`,
   que es lo que la hace consistente con el resto de datapol.lat y lo que permite
   que esta página aparezca en el desplegable sin tocar nada más. */
.mode-bar{background:var(--fondo);border-bottom:1px solid var(--linea);
  display:flex;align-items:center;padding:0 1.25rem;height:28px}
.mode-tab{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--suave);padding:.3rem .75rem;text-decoration:none;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.mode-tab[aria-current]{color:var(--terra);border-bottom-color:var(--terra)}
.mode-tab:hover:not([aria-current]){color:var(--tinta)}
.cab{background:var(--fondo);border-bottom:2px solid var(--tinta);
  padding:.55rem 1.25rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.cab-id{display:flex;align-items:center;gap:.75rem}
.cab-tit{font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;
  letter-spacing:.04em;line-height:1;white-space:nowrap}
.cab-avance{flex:1;max-width:300px;min-width:180px}
.cab-av-lab{display:flex;justify-content:space-between;font-size:9px;
  color:var(--suave);letter-spacing:.04em;margin-bottom:4px}
.cab-stats{display:flex;gap:1.25rem;margin-left:auto}
.hstat{display:flex;flex-direction:column;align-items:flex-end}
.hstat-lab{font-size:8px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.hstat-val{font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;line-height:1}
.hstat-val.hi{color:var(--terra)}
@media(max-width:700px){.cab-stats{margin-left:0;width:100%}
  .cab-avance{max-width:none}}
/* Este bloque redefinía `.nav` —el mismo selector que la barra negra— y era
   residuo de una barra de modos anterior. Con `/shared/nav.css` en juego habría
   peleado con la barra del sitio. */
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--suave)}
/* `display:inline-flex` gana sobre el `[hidden]{display:none}` del navegador,
   así que ocultarlo con la propiedad `hidden` no bastaba: el punto de sondeo
   seguía junto al rótulo de reproducción, diciendo dos cosas a la vez. */
.vivo[hidden]{display:none}
.pulso{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
@media (prefers-reduced-motion:no-preference){
  .pulso.on{animation:lat 2.4s ease-in-out infinite}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.25}}}
.pulso.off{background:var(--tenue)}
/* Sin rótulo de reproducción: el año ya sale en el título, en la cabecera y en
   la barra del sitio, y al no sondear no queda ninguna afirmación de «en
   directo» que desmentir. Lo que sí se esconde es el indicador de sondeo, que
   sin sondeo no dice nada. */

/* --- marcador de estados --- */
.marcador{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
/* El avance del escrutinio manda sobre todo lo demás: sin saber cuánto se ha
   contado, ninguna otra cifra de la página significa nada. */
.heroe{background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:3px;
  padding:16px 18px;margin-bottom:10px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.heroe .k{font-family:'Bebas Neue',Impact,sans-serif;font-size:48.5px;font-weight:400;
  letter-spacing:.02em;line-height:.9;color:var(--terra)}
.heroe .e{font-size:11.5px;color:var(--suave)}
.heroe .pista{flex:1 1 160px;min-width:140px}
.riel{height:5px;border-radius:2px;background:var(--arena);overflow:hidden;margin-top:6px}
.riel i{display:block;height:100%;background:var(--terra);border-radius:2px}
.nivel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.nivel .caja{background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:11px 13px}
.nivel h3{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--suave);font-weight:600}
.nivel .l{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0}
.nivel .l span:first-child{display:flex;align-items:center;gap:6px;color:var(--suave)}
/* La caja ocupa el ancho de la página, como el resto de los paneles; la rejilla
   va centrada dentro y ajustada a su contenido. Estirar las burbujas a todo el
   ancho las desperdigaba y el cuerpo dejaba de leerse como uno solo. */
.hemi-caja{display:flex;justify-content:center;width:100%;
  padding:30px 16px;background:var(--panel);border:1px solid var(--linea);
  border-radius:3px;overflow-x:auto}
.hemi{display:flex;flex-direction:column;gap:5px}
.hemi-fila{display:flex;justify-content:center;gap:5px}
.silla{width:40px;height:40px;border-radius:50%;background:var(--vacio);
  border:1.5px solid var(--linea-fuerte);display:block}
.b{width:12px;height:12px;border-radius:50%;background:var(--vacio);
  border:1px solid var(--linea-fuerte);display:inline-block;flex:none}
@media(max-width:560px){.hemi-caja{padding:20px 10px}
  .hemi,.hemi-fila{gap:3px}.silla{width:24px;height:24px}}
.carita{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--vacio);
  flex:none;display:inline-block}
.tile{background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:12px 14px}
.tile .k{font-family:'Bebas Neue',Impact,sans-serif;font-size:27px;font-weight:400;
  letter-spacing:.02em;line-height:1}
.tile .e{font-size:11px;color:var(--suave);display:flex;align-items:center;gap:6px;margin-top:2px}
.punto{width:9px;height:9px;border-radius:50%;flex:none}

/* --- mapa --- */
.mapa{background:var(--panel);border:1px solid var(--linea);border-radius:3px;
  overflow:hidden;position:relative}
.lienzo{width:100%;height:clamp(320px,58vh,620px);background:var(--panel)}
.leaflet-container{background:var(--panel);font:inherit}
/* OSM viene con relieve verde y carreteras ocres que compiten con los datos.
   A grises y aclarado se convierte en lo que tiene que ser: una referencia de
   dónde queda cada cosa, por debajo de la única capa que hay que leer. */
/* Sobre crema el gris puro se ve azulado, así que el fondo se vira a sepia para
   que no pelee con el papel. */
.leaflet-tile-pane{filter:grayscale(1) sepia(.35) brightness(1.05) contrast(.7) opacity(.45)}
.leaflet-tooltip{background:var(--tinta);color:var(--fondo);border:0;border-radius:2px;
  font-size:11px;padding:9px 12px;box-shadow:none;line-height:1.45}
.leaflet-tooltip:before{display:none}
/* Leaflet encoge el tooltip al ancho del contenido más corto. `max-content` deja
   que crezca hasta el tope, para que un nombre de organización no se parta en
   tres renglones. */
.tt-mapa{width:max-content;max-width:420px;min-width:230px;white-space:normal}
.tt-circ{display:block;font-size:12px;letter-spacing:-.01em;margin-bottom:3px}
.tt-est{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
  opacity:.7;margin-bottom:5px}
.tt-cand{display:block;font-weight:600}
.tt-org{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.03em;
  opacity:.7;margin-bottom:6px}
.tt-org:last-child{margin-bottom:0}
.leaflet-control-zoom a{color:var(--tinta);background:var(--panel);
  border-color:var(--linea-fuerte)}
.leaflet-bar{border:1px solid var(--linea-fuerte);box-shadow:none}
.leaflet-control-attribution{background:var(--panel);color:var(--tenue);font-size:9px}
.leaflet-control-attribution a{color:var(--tenue)}
/* El selector de nivel vive dentro del mapa, en la esquina. */
.ctl-nivel{background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:2px;
  padding:4px;display:flex;flex-direction:column;gap:2px}
.ctl-nivel button{font:inherit;font-size:11px;padding:4px 9px;border:0;border-radius:5px;
  background:transparent;color:var(--suave);cursor:pointer;text-align:left;white-space:nowrap}
.ctl-nivel button[aria-pressed="true"]{background:var(--tinta);color:var(--fondo)}
.pieza{cursor:pointer}
/* El navegador dibuja un rectángulo de foco alrededor del <path> al pasar por
   encima, y en un mapa se lee como si el distrito fuera cuadrado. */
.leaflet-interactive:focus,.leaflet-interactive:focus-visible{outline:none}
.pieza.trama{fill:url(#trama)}
.escanos-mapa div{display:flex;flex-wrap:wrap;gap:2px;width:max-content;max-width:64px;
  transform:translate(-50%,-50%);background:var(--panel);padding:3px 4px;border-radius:7px;
  border:1px solid var(--linea-fuerte)}
.escanos-mapa i{width:9px;height:9px;border-radius:50%;display:block;
  border:1px solid rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:11.5px;padding:6px 12px;border:1px solid var(--linea-fuerte);
  background:var(--panel);color:var(--suave);border-radius:2px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--terra);color:#fff;border-color:var(--terra)}
.leyenda{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;
  font-size:11px;color:var(--suave);padding:12px;border-top:1px solid var(--linea)}
.leyenda span.it{display:inline-flex;align-items:center;gap:6px}

/* --- tablas --- */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:8px 8px;border-bottom:1px solid var(--linea);text-align:left}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);
   font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right}
.envuelve{overflow-x:auto;-webkit-overflow-scrolling:touch}
.barra{height:8px;border-radius:4px;display:block;background:var(--s1);min-width:2px}
.logo{width:20px;height:20px;min-width:20px;object-fit:contain;vertical-align:middle;flex:none}
.org{display:flex;align-items:center;gap:9px;min-width:0}
.pill{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block}
.abrir{font:inherit;font-size:13.5px;line-height:1;border:1px solid var(--linea-fuerte);
  background:var(--panel);color:var(--tinta);cursor:pointer;flex:none;
  width:22px;height:22px;border-radius:2px;display:grid;place-items:center}
.abrir:hover{border-color:var(--tinta)}
tr.hijo td{color:var(--suave)}
tr.hijo[hidden]{display:none}
.aut .pill{width:22px;height:22px}
.aut-g .pill{width:30px;height:30px}
/* Candidato y partido en dos renglones, con pesos distintos: se vota a una
   persona por un partido, y la fila tiene que dejar leer las dos cosas sin que
   compitan. */
.ident{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.cand-nom{font-weight:600;font-size:12.5px}
.part-nom{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.03em}
.por-que{font-size:11px;color:var(--tinta);font-weight:500}
td .carita{width:32px;height:32px;border-radius:50%;object-fit:cover;
  background:var(--vacio);flex:none}
.aut{display:flex;align-items:center;gap:11px;padding:9px 2px;
  border-bottom:1px solid var(--linea)}
.aut-logo{width:22px;height:22px;min-width:22px;object-fit:contain;flex:none}
.aut-foto{width:38px;height:38px;border-radius:50%;object-fit:cover;
  background:var(--vacio);flex:none}
/* El ejecutivo es el titular de la noticia: su cara va al doble. */
.aut-g{gap:14px;padding:14px 2px}
.aut-g .aut-logo{width:30px;height:30px;min-width:30px}
/* En el callout del electo el logo compite de tú a tú con la cara: es la otra
   mitad de la noticia, no una viñeta al margen. */
.desenlace .aut-g .aut-logo{width:64px;height:64px;min-width:64px}
@media(max-width:560px){.desenlace .aut-g .aut-logo{width:46px;height:46px;min-width:46px}}
.aut-g .aut-foto{width:76px;height:76px}
.aut-g .cand-nom{font-family:'Bebas Neue',Impact,sans-serif;font-size:22.5px;
  font-weight:400;letter-spacing:.02em;line-height:1.05}
.aut .m{font-size:11px;color:var(--suave)}
.desenlace{background:var(--panel);border:1px solid var(--linea-fuerte);
  border-radius:3px;margin:16px 0 10px;overflow:hidden}
/* Franja, no chip: el estado de la carrera es el titular de la caja y tiene que
   decir **qué** se eligió, no un genérico «Electo». */
.franja{background:var(--tinta);color:var(--fondo);padding:8px 18px;
  font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.franja-sub{font-weight:500;letter-spacing:.04em;opacity:.75;text-transform:none}
.des-cuerpo{padding:14px 18px 16px}
.des-par{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.des-card{min-width:0}
.des-card .cand-nom{font-family:'Bebas Neue',Impact,sans-serif;font-size:24.5px;
  font-weight:400;letter-spacing:.02em;line-height:1.05}
.des-pct{font-size:11.5px;color:var(--suave);font-variant-numeric:tabular-nums;margin-top:3px}
.des-hdv{margin-top:8px}
.avance-caja{background:var(--panel);border:1px solid var(--linea);border-radius:3px;
  padding:13px 16px;margin-bottom:4px}
.avance-caja .e{font-size:11px;color:var(--suave);margin-bottom:6px}
.ver-mas{font:inherit;font-size:9px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;margin-top:10px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--linea-fuerte);background:var(--panel);color:var(--suave);
  border-radius:2px;width:100%}
.ver-mas:hover{border-color:var(--tinta);color:var(--tinta)}
tr.mas[hidden]{display:none}
.ver-hdv{font:inherit;font-size:11px;padding:6px 11px;border:1px solid var(--linea-fuerte);
  background:var(--panel);color:var(--suave);border-radius:2px;cursor:pointer;
  white-space:nowrap;flex:none}
.ver-hdv:hover{border-color:var(--tinta);color:var(--tinta)}
/* Leaflet apila sus paneles y controles hasta z-index 1000, así que con 40 el
   mapa se quedaba por encima del fondo del modal y la ficha se leía sobre él. */
#modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
/* `display:flex` pisa al atributo `hidden`, que no lleva !important. Sin esto el
   modal tapa la página entera desde el primer render. */
#modal[hidden]{display:none}
.hoja{background:var(--fondo);border-radius:3px;padding:22px;max-width:520px;width:100%;
  position:relative;border:1px solid var(--tinta)}
.hoja .cerrar{position:absolute;top:10px;right:12px;font:inherit;font-size:20px;
  line-height:1;border:0;background:transparent;color:var(--suave);cursor:pointer}
.fd{display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--linea);font-size:12.5px}
.fd>span:first-child{color:var(--suave);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em}
.fd .mal{color:var(--s2)}
.edu{display:inline-flex;gap:3px}
.edu .lv{font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--linea-fuerte)}
.edu .lv.on{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.edu .lv.off{color:var(--tenue)}
.hoja{max-height:86vh;overflow:auto}
.fs{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);
  font-weight:650;margin:18px 0 6px}
.fl{display:flex;flex-direction:column;gap:2px}
.fi{padding:7px 0;border-bottom:1px solid var(--linea);font-size:12px;
  display:flex;flex-direction:column;gap:1px}
.fi span{font-size:11px;color:var(--suave)}
.fi.mal-bloque b{color:var(--s2)}

.pordef{color:var(--tenue);font-style:italic}
.escano{display:inline-block;width:13px;height:13px;border-radius:50%;margin:1px;
  background:var(--vacio);vertical-align:middle;border:1px solid var(--linea-fuerte)}
.fila{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linea);
  flex-wrap:wrap}
.fila b{font-weight:600;font-size:11.5px;flex:1 1 180px;min-width:0}
.chip{display:inline-block;padding:3px 10px;border-radius:2px;font-size:11px;
  border:1px solid var(--linea-fuerte);color:var(--suave)}

           patternTransform="rotate(45)">

<script>
"use strict";
// ---------------------------------------------------------------- utilidades
const F=n=>new Intl.NumberFormat('es-PE').format(n??0);
const P=x=>(100*(x??0)).toFixed(1)+'%';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// En datapol la página y sus datos viven en ramas distintas del árbol —la
// página en `/electoral/...`, los datos en `/peru/...`—, que es la convención
// que ya sigue 2026eg. En local, con el servidor apuntando a `data/publico`,
// están al lado. Se resuelve por la ubicación de la página, para que el mismo
// archivo sirva en los dos sitios y no haya dos copias que mantener.
const BASE = window.PROC ? `../../../peru/${window.PROC}/data/` : '';
const j=async u=>{const r=await fetch(BASE+u,{cache:'no-store'});
  if(!r.ok) throw new Error(u+' → '+r.status); return r.json()};

// ERM 2022 es un proceso cerrado: el contrato que sirve esta página es un corte
// fijo, no un cómputo que avance. Sondearlo sería pedir lo mismo cada 45
// segundos y, peor, el pulso en verde diría «en directo» sobre una elección de
// hace cuatro años. Cuando esto se porte a 2026 se pone en false y el sondeo
// vuelve solo.
// Se fija al cargar `meta.json`: ERM 2022 es un proceso cerrado y no hay nada
// que sondear; 2026 sí avanzará durante la noche.
let REPLAY = true;

// Estados del pronóstico. Color reservado + etiqueta: nunca solo color.
// `t` cuenta carreras en el marcador nacional (plural); `u` califica una sola
// carrera. «Electas» colgado del chip de una carrera se leía como un error.
// Todo en mayúsculas, como los nombres de organización, para que no convivan
// dos convenciones en la misma columna. `t` cuenta autoridades en el marcador
// nacional; `u` califica una sola elección.
const EST={
  electo:        {t:'ELECTOS',           u:'ELECTO',              v:'--ok'},
  segunda_vuelta:{t:'A SEGUNDA VUELTA',  u:'VA A SEGUNDA VUELTA', v:'--segunda'},
  empate:        {t:'EN EMPATE',         u:'EMPATE — VA A SORTEO',v:'--espera'},
  sin_resultado: {t:'ANULADAS',          u:'ELECCIÓN ANULADA',    v:'--disputa'},
  por_definir:   {t:'EN DISPUTA',        u:'EN DISPUTA',          v:'--disputa'}};
const etiq=(e,plural=false)=>(EST[e]?.[plural?'t':'u'])||e;
const NIVEL={'01':'Gobernador regional','02':'Consejo regional',
             '03':'Alcaldía provincial','04':'Alcaldía distrital'};
// El marcador nombra **a quien se elige**, en masculino plural, para que
// «ELECTOS» concuerde. «ALCALDÍA PROVINCIAL · ELECTAS» no se sostenía.
const NIVEL_PLURAL={'01':'Gobernadores','03':'Alcaldes provinciales',
                    '04':'Alcaldes distritales'};

let META=null, NAC=null, GEO={}, RUTA_ACTUAL=null, BUSQUEDA='';

// Tres hues categóricos + «Otras». Ver el comentario de la hoja de estilos.
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// Un color estable por organización, de `colores.json`. No depende del ranking:
// si dependiera, cada vez que una lista adelantara a otra durante la noche se
// repintarían las dos y el lector leería un cambio que no ocurrió.
let COLORES={};
const colorDe=c=>{
  const par=COLORES[c];
  return par ? par[esOscuro()?1:0] : (c ? css('--otras') : css('--vacio'));
};
const esNacional=c=>!!(COLORES[c]||[])[2];
// En el mapa del resumen los movimientos regionales van de un solo ocre. Cada
// uno tiene su color y se ve en su página y en la tabla de abajo; pero a escala
// de país son 115 tonos que no se pueden nombrar en ninguna leyenda, y pintados
// aparte convierten el mapa en ruido. Agrupados dicen algo: dónde gana un
// partido nacional y dónde no.
const colorNacional=c=>esNacional(c) ? colorDe(c) : css('--regional');
// La burbuja que explica el color donde está el nombre. El mapa ya no lleva
// leyenda de partidos: con 128 organizaciones nadie lee 128 entradas.
const burbuja=c=>`<span class="pill" style="background:${colorDe(c)}"></span>`;

// ------------------------------------------------------------------- tooltip
const tt=$('tt');
function conTooltip(el, texto){
  const mover=ev=>{const t=ev.touches?ev.touches[0]:ev;
    tt.textContent=texto; tt.style.opacity=1;
    const x=Math.min(t.clientX+12, innerWidth-tt.offsetWidth-8);
    tt.style.left=x+'px'; tt.style.top=Math.max(8,t.clientY-38)+'px'};
  el.addEventListener('mousemove',mover);
  el.addEventListener('touchstart',mover,{passive:true});
  el.addEventListener('mouseleave',()=>tt.style.opacity=0);
  el.addEventListener('touchend',()=>tt.style.opacity=0);
}

// ---------------------------------------------------------------------- mapa
// Leaflet en vez de un SVG propio. Se gana lo que el SVG no daba: zoom con + y −,
// arrastre, y referencia geográfica para ubicar un distrito de verdad —en el
// mapa distrital nacional, 1,890 polígonos sueltos son una mancha—.
//
// FONDO: OSM DESATURADO POR CSS.
// CartoDB, que es la opción sobria obvia, hoy exige clave: devuelve las teselas
// estampadas con «API KEY REQUIRED». OSM es lo único usable sin clave, pero su
// cartografía es demasiado colorida —el verde y el ocre del relieve compiten con
// los datos—. La solución barata es un filtro CSS sobre el panel de teselas
// (`.leaflet-tile-pane`): a escala de grises y aclarado queda un fondo pálido
// que ubica sin estorbar. Ver la hoja de estilos.
//
// **Sigue pendiente para el 4 de octubre**: la política de uso de OSM prohíbe el
// tráfico masivo, y 20,000 concurrentes es exactamente eso. La salida definitiva
// es una clave de proveedor o teselas propias. Mientras tanto el mapa no depende
// del fondo para informar: encima va el contorno de departamentos dibujado con
// nuestra geometría, así que si OSM falla se pierde la referencia de calles, no
// la orientación ni los datos.
const TILES='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ATRIB='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
// datapol.lat no tiene modo oscuro: una página que sí lo tuviera se vería ajena
// bajo la misma barra de navegación.
const esOscuro=()=>false;

function creaMapa(cont){
  cont.innerHTML='';
  const lienzo=document.createElement('div');
  lienzo.className='lienzo';
  cont.appendChild(lienzo);
  const m=L.map(lienzo,{
    zoomControl:true, attributionControl:true,
    // Sin esto la rueda del ratón secuestra el scroll de la página cada vez que
    // el cursor cruza el mapa. Con + y − y pellizco en móvil, no hace falta.
    scrollWheelZoom:false,
    zoomSnap:.25, minZoom:3, maxZoom:14});
  L.tileLayer(TILES,{attribution:ATRIB, maxZoom:14, crossOrigin:true}).addTo(m);
  // El mapa se crea mientras la página todavía se está armando, así que Leaflet
  // mide un contenedor que aún no tiene su tamaño final y el encuadre sale mal.
  // Se vuelve a medir cuando el contenedor cambia de tamaño, y se reencuadra.
  // Al hacer zoom o arrastrar, la pieza bajo el cursor cambia sin que Leaflet
  // dispare `mouseout` sobre la anterior, así que el tooltip se queda pegado.
  // Se cierra a mano en cada evento que mueve el mapa, y al salir del lienzo.
  // Dos trampas juntas. `map.closeTooltip()` sin argumento **lanza excepción** en
  // Leaflet 1.9 —y disparándose en `movestart` durante el `fitBounds` inicial,
  // reventaba el montaje del mapa y ningún tooltip llegaba a enlazarse—. Y
  // `map.eachLayer` recorre solo las capas directas, no las de dentro del grupo
  // de GeoJSON, así que tampoco alcanzaba a las piezas. Se guarda cuál está
  // abierto y se cierra esa.
  const cierra=()=>{
    (m._capas||[]).forEach(c=>c.eachLayer(o=>{ if(o.closeTooltip) o.closeTooltip() }));
    m._ttAbierto=null;
  };
  m.on('zoomstart movestart', cierra);
  lienzo.addEventListener('mouseleave', cierra);
  lienzo.addEventListener('touchend', ()=>setTimeout(cierra, 1800));

  if(window.ResizeObserver){
    // `invalidateSize` puede alterar el contenedor y volver a disparar al
    // observador: sin el guardia de tamaño real, el mapa entra en un bucle de
    // reflujo que hace saltar el scroll de toda la página.
    let w=0,hh=0,pend=0;
    new ResizeObserver(entradas=>{
      const c=entradas[0].contentRect;
      if(Math.abs(c.width-w)<2 && Math.abs(c.height-hh)<2) return;
      w=c.width; hh=c.height;
      cancelAnimationFrame(pend);
      pend=requestAnimationFrame(()=>{
        m.invalidateSize({animate:false});
        if(m._encuadre) m.fitBounds(m._encuadre,{padding:[10,10],animate:false});
      });
    }).observe(lienzo);
  }
  return m;
}

// Contorno de la unidad superior, por encima de los rellenos. Es lo que permite
// leer un mapa de 1,890 piezas: sin las fronteras del nivel de arriba, un mapa
// distrital es una mancha sin referencia. Misma lógica en todos los mapas —lo
// que cambia es cuál es el nivel de arriba— y por eso va en una sola función.
const CACHE_GEO={};
async function contorno(m, url='geo/nacional-01.geojson', peso=1.6){
  try{
    if(!CACHE_GEO[url]) CACHE_GEO[url]=await j(url);
    const capa=L.geoJSON(CACHE_GEO[url],{interactive:false, pane:'markerPane',
      smoothFactor:0, style:{
      color:css('--tinta'), weight:peso, opacity:.75, fill:false,
      lineJoin:'round'}}).addTo(m);
    return capa;
  }catch(e){ return null }
}

// `pinta(ubigeo, props) -> {color, texto, href, trama}`
// `peso` es el grosor del borde entre piezas. Las capas agregadas —departamento,
// provincia— llevan borde marcado porque cada pieza es una unidad política que
// se lee de lejos; la distrital lo lleva fino porque con 1,890 piezas un borde
// grueso se come el relleno y el mapa se vuelve una retícula.
// `smoothFactor:0` no es un detalle: es lo único que hace que las capas casen.
// Por defecto Leaflet vale 1, y eso **simplifica cada trazo a un píxel de
// pantalla al dibujarlo**, capa por capa y por separado. Alejado, un píxel son
// kilómetros: Douglas-Peucker se queda con vértices distintos en el contorno
// largo de un departamento que en el anillo corto de cada distrito, y la misma
// frontera sale por dos sitios. Acercado, un píxel no es nada y todo calza —que
// es justo lo que se veía—. La geometría ya viene simplificada desde el
// pipeline, con topología compartida; simplificarla otra vez aquí, en pantalla
// y sin topología, solo puede romperla.
function agregaCapa(m, gj, pinta, {peso=1.1}={}){
  let capa;
  capa=L.geoJSON(gj,{
    smoothFactor:0,
    style:f=>{
      const i=pinta(f.properties.ubigeo, f.properties)||{};
      return {color:css('--tinta'), weight:peso, opacity:.55,
              fillColor:i.color||css('--vacio'), fillOpacity:i.trama?1:.9,
              lineJoin:'round',
              className:'pieza'+(i.trama?' trama':'')};
    },
    onEachFeature:(f,l)=>{
      const i=pinta(f.properties.ubigeo, f.properties)||{};
      // El tooltip es la única lectura del mapa, así que va en renglones y no en
      // una línea corrida: circunscripción, estado, y recién después quién.
      l.bindTooltip(`<b class="tt-circ">${esc(f.properties.nombre)}</b>`+
        (i.texto||''), {sticky:true, className:'tt-mapa'});
      l.on('mouseover',()=>{
        // Al cruzar rápido varias piezas —o al arrastrar el mapa— el `mouseout`
        // de la anterior no siempre llega, y cada `mouseover` abría un tooltip
        // más: llegaban a quedar cinco pegados a la vez. Antes de abrir uno se
        // cierran **todos** los de esta capa; guardar solo el último no bastaba,
        // porque dos `mouseover` en el mismo tick se pisaban.
        capa.eachLayer(o=>{ if(o!==l && o.closeTooltip) o.closeTooltip() });
        l.setStyle({weight:peso+1.6,opacity:1});
        m._ttAbierto=l;
      });
      // Leaflet ya cierra el tooltip en su propio `mouseout`; llamar a
      // `closeTooltip()` aquí lo cerraba antes de que llegara a verse.
      l.on('mouseout',()=>{ l.setStyle({weight:peso,opacity:.55});
        if(m._ttAbierto===l) m._ttAbierto=null; });
      if(i.href) l.on('click',()=>{location.hash=i.href});
    }}).addTo(m);
  (m._capas=m._capas||[]).push(capa);
  try{
    m.invalidateSize({animate:false});
    m._encuadre=capa.getBounds();
    m.fitBounds(m._encuadre,{padding:[10,10],animate:false});
  }catch(e){}
  return capa;
}

// Selector de nivel, dentro del mapa y en la esquina.
function controlNiveles(m, niveles, activo, alCambiar){
  const C=L.Control.extend({
    onAdd(){
      const d=L.DomUtil.create('div','ctl-nivel');
      d.innerHTML=niveles.map(([k,l])=>
        `<button data-k="${k}" aria-pressed="${k===activo}">${l}</button>`).join('');
      L.DomEvent.disableClickPropagation(d);
      d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        d.querySelectorAll('button').forEach(x=>
          x.setAttribute('aria-pressed', String(x===b)));
        alCambiar(b.dataset.k);
      });
      return d;
    }});
  return new C({position:'topright'}).addTo(m);
}

// --------------------------------------------------------- vista: nacional
// La leyenda del mapa tiene como máximo cuatro entradas: movimientos regionales
// y los tres estados. **Ningún partido se nombra aquí**: su color se explica donde
// está su nombre, con la burbuja al costado en las tablas. Nombrarlos devolvía la
// leyenda al problema de partida —ocho entradas en la provincial, y creciendo—.
// Y lista solo lo que el mapa dibuja: el de Loreto, donde toda provincia tiene
// resultado y toda elige gobernador, anunciaba dos categorías ausentes.
function leyendaEstados(marcas){
  const it=(color,txt,borde='')=>`<span class="it"><span class="punto"
    style="background:${color};${borde}"></span>${txt}</span>`;
  const partes=[];
  if(marcas.has('segunda')) partes.push(it('var(--segunda)','VA A SEGUNDA VUELTA'));
  if(marcas.has('empate')) partes.push(it('var(--empate)','EMPATE'));
  if(marcas.has('anulada')) partes.push(it('var(--anulada)','ANULADA'));
  if(marcas.has('sin'))
    partes.push(it('var(--vacio)','EN DISPUTA','border:1px solid var(--linea-fuerte)'));
  if(marcas.has('sin_actas'))
    partes.push(it('var(--vacio)','SIN ACTAS','border:1px solid var(--linea-fuerte)'));
  if(marcas.has('no_participa'))
    partes.push(it('var(--vacio)','NO ELIGE ESTA AUTORIDAD','border:1px dashed var(--tenue)'));
  return partes.length?`<div class="leyenda">${partes.join('')}</div>`:'';
}

async function vistaNacional(){
  const n=NAC, nombres=n.organizaciones_nombre||{};
  const est=n.estados||{}, porTipo=n.estados_por_tipo||{};
  const orden=['electo','segunda_vuelta','empate','por_definir','sin_resultado'];
  const llamadas=(est.electo||0)+(est.segunda_vuelta||0);
  cabecera();
  // Orden de la página: buscador, mapa, estado, organizaciones.
  //
  // El buscador antes que nada: con 2,113 elecciones, lo primero que hace
  // cualquiera es ir a la suya. Y el mapa antes del marcador, porque es la
  // lectura que de verdad se mira —dónde ganó quién— mientras que el conteo por
  // nivel es el resumen de esa misma información. Se arman por separado y se
  // ordenan al final, para que cambiar el orden sea mover una línea.
  const bloqueMapa = `<h2>Mapa</h2>
    <div class="tabs" role="group" aria-label="Nivel del mapa">`+
    [['01','Gobernador'],['03','Provincial'],['04','Distrital']].map(([t,l])=>
      `<button class="tab" data-m="${t}" aria-pressed="false">${l}</button>`).join('')+
    `</div><div class="mapa" id="mapa"><div class="aviso" style="border:0">Cargando mapa…</div></div>
    <div id="leyN"></div>`;

  // El marcador por nivel: 1,694 distritales tapan lo que pasa en las 25
  // regionales, que son las que de verdad se siguen. Solo los tres ejecutivos;
  // el consejo regional no es una carrera que se «gane», es un reparto
  // proporcional y se lee en la página de cada región.
  const nivelesM=Object.entries(NIVEL_PLURAL).filter(([t])=>porTipo[t]);
  const bloqueEstado = `<h2>Estado</h2>` + (!nivelesM.length ? '' :
    `<div class="nivel">`+
    nivelesM.map(([t,l])=>{
      const e=porTipo[t], tot=Object.values(e).reduce((x,y)=>x+y,0);
      return `<div class="caja"><h3>${l} · ${F(tot)}</h3>`+
        orden.filter(k=>e[k]).map(k=>`<div class="l">
          <span><span class="punto" style="background:var(${EST[k].v})"></span>${etiq(k,true)}</span>
          <b>${F(e[k])}</b></div>`).join('')+`</div>`;
    }).join('')+`</div>`);

  let h = bloqueBuscar('Busca una contienda') + bloqueMapa + bloqueEstado;

  // --- tabla por organización
  // --- tabla de organizaciones, con agrupación
  // Los 115 movimientos regionales ocupaban 115 filas para decir, uno por uno,
  // lo que interesa leer junto: cuánto pesa el conjunto frente a los partidos
  // nacionales. Van bajo un solo sello —el mismo ocre del mapa— y se despliegan
  // si alguien quiere el detalle. El mecanismo es general: se agrupa por clave,
  // y hoy la única clave agrupada es la de movimientos regionales.
  // Los grupos los declara el contrato, no los deduce el navegador. Una alianza
  // electoral agrupa partidos y eso no es derivable del tipo de organización:
  // deducirlo metía las diez alianzas de 2026 en el saco de los regionales.
  // ERM 2022 no trae el campo, así que ahí se mantiene la regla vieja.
  const GRUPOS={REGIONALES:{nombre:'MOVIMIENTOS REGIONALES', color:'var(--regional)'}};
  for(const o of (n.por_organizacion||[]))
    if(o.grupo && o.grupo_nombre && !GRUPOS[o.grupo])
      GRUPOS[o.grupo]={nombre:o.grupo_nombre, color:'var(--regional)'};
  const declara=(n.por_organizacion||[]).some(o=>'grupo' in o);
  const claveDe=o=>declara ? (o.grupo||null)
                           : (esNacional(o.codigo) ? null : 'REGIONALES');
  const CAMPOS=['gobernador_1v','gobernador_2v','alcalde_prov','alcalde_dist',
                'consejero','regidor_prov','regidor_dist'];
  // `listas` entra en la suma además de los cargos: es el criterio de desempate
  // del orden, y sin sumarla el total de un grupo salía sin listas y las cuatro
  // alianzas caían al fondo de la tabla.
  const suma=(a,b)=>{const r={...a};
    for(const k of [...CAMPOS,'listas']) r[k]=(r[k]||0)+(b[k]||0); return r};
  // Orden lexicográfico por la jerarquía del cargo, no por el total: quien ganó
  // una gobernación va antes que quien ganó cuarenta regidurías distritales.
  // Sumar todo dejaba arriba a los que acumulan cargos menores.
  // Orden: primero por jerarquía del cargo ganado —quien se llevó una gobernación
  // va antes que quien ganó cuarenta regidurías—, y **a igualdad, por listas
  // inscritas**. El desempate no es cosmético: antes de que abran las urnas todo
  // está a cero y el criterio del cargo no ordena nada, así que la tabla salía
  // alfabética y un partido con 1,191 listas aparecía debajo de uno con 3.
  const cmp=(a,b)=>{
    for(const k of CAMPOS){ const d=(b[k]||0)-(a[k]||0); if(d) return d }
    const dl=(b.listas||0)-(a.listas||0); if(dl) return dl;
    return String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
  };

  const sueltas=[], agrupadas={};
  for(const o of (n.por_organizacion||[])){
    const k=claveDe(o);
    if(!k){ sueltas.push({tipo:'org', o}); continue }
    (agrupadas[k]=agrupadas[k]||{clave:k, tot:{}, hijos:[]});
    agrupadas[k].tot=suma(agrupadas[k].tot, o);
    agrupadas[k].hijos.push(o);
  }
  const filas=[...sueltas, ...Object.values(agrupadas).map(g=>({tipo:'grupo', g}))]
    .sort((a,b)=>cmp(a.tipo==='org'?a.o:{...a.g.tot, nombre:GRUPOS[a.g.clave].nombre},
                     b.tipo==='org'?b.o:{...b.g.tot, nombre:GRUPOS[b.g.clave].nombre}));

  const celdas=o=>`<td class="n">${o.gobernador_1v||0}<span class="sub">+${
      o.gobernador_2v||0}</span></td>
    <td class="n">${F(o.alcalde_prov||0)}</td><td class="n">${F(o.alcalde_dist||0)}</td>
    <td class="n">${F(o.consejero||0)}</td><td class="n">${F(o.regidor_prov||0)}</td>
    <td class="n">${F(o.regidor_dist||0)}</td>`;

  h+=`<h2>Organizaciones <span class="sec">${F((n.por_organizacion||[]).length)}</span></h2>
    <div class="envuelve"><table>
    <thead><tr><th>Organización</th><th class="n">Gob. 1.ª+2.ª</th>
    <th class="n">Alc. prov.</th><th class="n">Alc. dist.</th>
    <th class="n">Consejeros</th><th class="n">Reg. prov.</th>
    <th class="n">Reg. dist.</th></tr></thead><tbody>`+
    filas.map(f=>{
      if(f.tipo==='org') return `<tr>
        <td><span class="org">${burbuja(f.o.codigo)}<img class="logo"
          src="${esc(f.o.logo||'')}" alt="" loading="lazy"
          onerror="this.style.visibility='hidden'">${esc(f.o.nombre)}</span></td>
        ${celdas(f.o)}</tr>`;
      const g=f.g, meta=GRUPOS[g.clave];
      return `<tr class="gr">
        <td><span class="org">
          <span class="pill" style="background:${meta.color}"></span>
          <button class="abrir" aria-expanded="false" data-g="${g.clave}"
            aria-label="Ver las ${g.hijos.length} organizaciones">+</button>
          ${esc(meta.nombre)} <span class="sub">· ${g.hijos.length}</span></span></td>
        ${celdas(g.tot)}</tr>`+
        g.hijos.sort(cmp).map(o=>`<tr class="hijo g-${g.clave}" hidden>
          <td><span class="org" style="padding-left:30px"><img class="logo"
            src="${esc(o.logo||'')}" alt="" loading="lazy"
            onerror="this.style.visibility='hidden'">${esc(o.nombre)}</span></td>
          ${celdas(o)}</tr>`).join('');
    }).join('')+`</tbody></table></div>`;

  $('vista').innerHTML=h;

  const porUbigeo={}; for(const c of n.por_carrera||[]) porUbigeo[c.tipo+c.ubigeo]=c;
  let mapaN=null, capaN=null;
  async function pintaMapa(tipo){
    document.querySelectorAll('.tab').forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.m===tipo)));
    const cont=$('mapa');
    try{
      if(!GEO[tipo]) GEO[tipo]=await j(`geo/nacional-${tipo}.geojson`);
      if(!mapaN){ mapaN=creaMapa(cont); }
      if(capaN) mapaN.removeLayer(capaN);
      const est=t=>`<span class="tt-est">${t}</span>`;
      const quien=g=>`<span class="tt-cand">${esc(g.candidato||'CANDIDATO POR DEFINIR')}</span>
        <span class="tt-org">${esc(g.organizacion||'')}</span>`;
      const marcas=new Set();
      capaN=agregaCapa(mapaN, GEO[tipo], (u,props)=>{
        if(props.no_participa){ marcas.add('no_participa');
          return {color:css('--vacio'), trama:true,
                  texto:est('NO ELIGE ESTA AUTORIDAD')}; }
        const c=porUbigeo[tipo+u];
        // Una elección anulada tampoco tiene ganador, así que la comprobación va
        // **antes** que la de «sin ganador»: si no, cae ahí y se pinta como si
        // siguiera en disputa. Es lo que le pasaba a Huamantanga.
        if(c && c.estado==='sin_resultado'){ marcas.add('anulada');
          return {color:css('--anulada'), texto:est('ELECCIÓN ANULADA'),
            href:`#/c/${c.race_id}`}; }
        // Mientras no haya resultado no se dice quién puntea: nombrar al que va
        // adelante lo hace parecer ganador, y en una elección abierta eso es
        // exactamente lo que no hay que insinuar.
        if(!c||!c.ganador){ marcas.add('sin');
          return {color:css('--vacio'),
            texto:est('EN DISPUTA')+(c?`<span class="tt-org">${P(c.pct_actas)} de actas contabilizadas</span>`:''),
            href:c?`#/c/${c.race_id}`:null}; }
        const gs=(c.ganadores||[]).length ? c.ganadores
          : [{organizacion:nombres[c.ganador]||c.ganador, candidato:null}];
        // Una elección que va a segunda vuelta **no la ganó nadie**: lleva el
        // color de estado, y el tooltip nombra a los dos que pasan.
        if(c.estado==='segunda_vuelta'){ marcas.add('segunda');
          return {color:css('--segunda'),
            texto:est('VA A SEGUNDA VUELTA')+gs.map(quien).join(''),
            href:`#/c/${c.race_id}`}; }
        // Un empate no lo ganó nadie: pintarlo del color de una de las listas
        // empatadas afirmaba lo contrario en el mapa.
        if(c.estado==='empate'){ marcas.add('empate');
          return {color:css('--empate'),
            texto:est('EMPATE — VA A SORTEO')+gs.map(quien).join(''),
            href:`#/c/${c.race_id}`}; }
        marcas.add(esNacional(c.ganador) ? c.ganador : 'regional');
        return {color:colorNacional(c.ganador),
          texto:est(etiq(c.estado))+quien(gs[0]),
          href:`#/c/${c.race_id}`};
      }, {peso: tipo==='04' ? .35 : 1.3});
      // Fronteras de referencia sobre los rellenos. En la capa 01 ya están
      // implícitas en las propias piezas; en la provincial basta el departamento;
      // en la distrital, 1,890 piezas sin provincias encima son una mancha.
      (mapaN._bordes||[]).forEach(b=>mapaN.removeLayer(b));
      mapaN._bordes=[];
      if(tipo==='04'){
        const prov=await contorno(mapaN,'geo/nacional-03.geojson',.7);
        if(prov) mapaN._bordes.push(prov);
      }
      if(tipo!=='01'){
        const dep=await contorno(mapaN);
        if(dep) mapaN._bordes.push(dep);
      }
      const ley=$('leyN'); if(ley) ley.innerHTML=leyendaEstados(marcas);
    }catch(e){ cont.innerHTML=`<div class="aviso" style="border:0">
      No se pudo cargar la geografía de este nivel.</div>` }
  }
  enchufaBuscar(META.carreras.filter(c=>c.tipo!=='02'), false);
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>pintaMapa(b.dataset.m));
  pintaMapa('01');

}

// ------------------------------------------------- vista: reelección lateral
// La Ley 30305 prohíbe la reelección inmediata de alcaldes. La vía que queda es
// encabezar la **lista de regidores** de la propia organización, que por ley es
// el puesto de teniente alcalde. Ciento treinta y cinco alcaldes electos en 2022
// lo hicieron en su propio municipio; 131 quedaron inscritos.
//
// El tablero existe porque esa jugada solo se puede juzgar el día que se cuenta:
// hasta entonces es una lista de intenciones. Aquí se ve cuál de las dos vías
// funcionó y para quién.
//
// El JSON lo arma `publica_tenientes.py`. El navegador no decide quién ganó: lee
// el campo `resultado`, que viene resuelto contra el contrato de cada carrera.
const RES_TEN={
  electo_alcalde: {t:'ALCALDE',          v:'--ok',      d:'Ganó la alcaldía'},
  electo_teniente:{t:'TENIENTE ALCALDE', v:'--ok',      d:'Su lista ganó y él entra al concejo'},
  electo_regidor: {t:'REGIDOR',          v:'--espera',  d:'Entró al concejo, pero su lista no ganó'},
  fuera:          {t:'FUERA',            v:'--disputa', d:'La carrera está resuelta y no está entre los electos'},
  en_disputa:     {t:'EN DISPUTA',       v:'--vacio',   d:'Todavía sin llamada'},
  sin_cruce:      {t:'NO APARECE',       v:'--vacio',   d:'Su lista no figura en el cómputo de esta carrera'}};
const ORDEN_RES=['electo_alcalde','electo_teniente','electo_regidor','fuera',
                 'en_disputa','sin_cruce'];
let TEN=null, FILTRO_TEN={q:'',region:'',nivel:'',via:'',res:''};

async function vistaTenientes(){
  cabecera();
  try{ TEN=await j('tenientes.json'); }
  catch(e){
    $('vista').innerHTML=`<div class="aviso">Todavía no hay tablero de reelección
      para este proceso.</div>`; return;
  }
  const casos=TEN.casos||[], marc=TEN.marcador||{}, vias=TEN.por_via||{};
  const electos=(marc.electo_alcalde||0)+(marc.electo_teniente||0)+(marc.electo_regidor||0);

  // Los cinco números que resumen la noche para este grupo. «Alcalde» va primero
  // y aparte de «teniente alcalde» a propósito: son el mismo movimiento con dos
  // desenlaces muy distintos, y mezclarlos borra justo lo que hay que mirar.
  const tile=(k,e,color)=>`<div class="tile"><div class="k">${F(k)}</div>
    <div class="e"><span class="punto" style="background:var(${color})"></span>${e}</div></div>`;

  let h=`<h1>Reelección por la puerta de al lado</h1>
    <div class="sub">${F(TEN.inscritos)} alcaldes en ejercicio encabezan la lista de
      regidores de su propio municipio${
      TEN.casos_en_registro>TEN.inscritos
        ? ` · ${TEN.casos_en_registro-TEN.inscritos} candidaturas más siguen en trámite y no se siguen aquí`
        : ''}</div>

    <div class="aviso">La reelección inmediata de alcaldes está prohibida desde la
      Ley 30305. La posición 1 de la lista de regidores es, por ley, el teniente
      alcalde: entrar por ahí es la manera de volver al municipio sin reelegirse.
      Solo se cuentan los que lo hacen en <b>su propia</b> circunscripción.</div>

    <h2>Marcador</h2>
    <div class="nivel" style="grid-template-columns:repeat(auto-fit,minmax(148px,1fr))">
      ${tile(marc.electo_alcalde||0,'Alcaldes','--ok')}
      ${tile(marc.electo_teniente||0,'Tenientes alcalde','--ok')}
      ${tile(marc.electo_regidor||0,'Regidores','--espera')}
      ${tile(marc.fuera||0,'Fuera','--disputa')}
      ${tile(marc.en_disputa||0,'En disputa','--vacio')}
    </div>

    <h2>Las dos vías</h2>
    <div class="nivel">
      <div class="caja"><h3>Directa · ${F(vias.directo||0)}</h3>
        <div class="sub">El candidato a alcalde de su lista se cayó —casi siempre
        por renuncia—, así que el alcalde en ejercicio pasó a encabezarla y
        compite por el sillón. La prohibición queda en nada sin que nadie la haya
        derogado.</div></div>
      <div class="caja"><h3>Indirecta · ${F(vias.indirecto||0)}</h3>
        <div class="sub">La cabeza de lista sigue en pie. Si su lista gana, él
        vuelve al concejo como teniente alcalde: gobierna otro y él se sienta al
        lado.</div></div>
    </div>

    <h2>Caso por caso <span class="sec">${F(casos.length)}</span></h2>
    <input class="buscar" id="tq" placeholder="Nombre, distrito, provincia u organización…"
      autocomplete="off" aria-label="Buscar un caso">
    <div class="casc" style="margin-top:10px">
      <label>Región<select id="t-reg"></select></label>
      <label>Nivel<select id="t-niv">
        <option value="">Provincial y distrital</option>
        <option value="provincial">Solo provincial</option>
        <option value="distrital">Solo distrital</option></select></label>
      <label>Vía<select id="t-via">
        <option value="">Las dos vías</option>
        <option value="directo">Directa</option>
        <option value="indirecto">Indirecta</option></select></label>
      <label>Resultado<select id="t-res">
        <option value="">Cualquiera</option>
        ${ORDEN_RES.filter(k=>marc[k]).map(k=>
          `<option value="${k}">${RES_TEN[k].t}</option>`).join('')}</select></label>
    </div>
    <div class="sub" id="t-cuenta" style="margin:10px 0 4px"></div>
    <div class="envuelve"><table>
      <thead><tr><th>Alcalde en ejercicio</th><th>Municipio</th>
        <th>Organización</th><th>Vía</th><th>Resultado</th></tr></thead>
      <tbody id="t-filas"></tbody></table></div>`;

  $('vista').innerHTML=h;

  const regiones=[...new Set(casos.map(c=>c.region))].sort((a,b)=>a.localeCompare(b,'es'));
  $('t-reg').innerHTML=`<option value="">Todas las regiones</option>`+
    regiones.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');

  const plano=s=>String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();

  function fila(c){
    const r=RES_TEN[c.resultado]||RES_TEN.sin_cruce;
    // En disputa se muestra la probabilidad de que su lista gane la alcaldía, que
    // es la misma pregunta en las dos vías: si gana, el directo es alcalde y el
    // indirecto es teniente alcalde. Sin probabilidad todavía, una raya: no se
    // inventa un número para llenar la celda.
    const derecha = c.resultado==='en_disputa'
      ? `<span class="chip">${c.p_gana!=null?`P(su lista gana) ${P(c.p_gana)}`:'—'}</span>
         <div class="sub">${P(c.pct_actas)} de actas</div>`
      : `<span class="chip si" style="background:var(${r.v});border-color:var(${r.v})${
           r.v==='--vacio'?';color:var(--tinta)':''}">${r.t}</span>`;
    const lugar = c.nivel==='provincial' ? c.provincia : c.distrito;
    const bajo  = c.nivel==='provincial' ? c.region : `${c.provincia}, ${c.region}`;
    return `<tr>
      <td><b>${esc(c.nombre)}</b><div class="sub">${esc(c.cargo_actual)}</div></td>
      <td><a href="#/c/${c.race_id}">${esc(lugar)}</a><div class="sub">${esc(bajo)}</div></td>
      <td>${esc(c.organizacion_2026)}${
        c.cambio_de_organizacion
          ? `<div class="sub">2022: ${esc(c.organizacion_2022)}</div>`
          : ''}</td>
      <td>${c.via==='directo'?'Directa':'Indirecta'}
        <div class="sub">${c.via==='directo'
          ? `cabeza caída · ${esc(c.estado_alcalde)}`
          : esc(c.alcalde_de_la_lista||'')}</div></td>
      <td>${derecha}</td></tr>`;
  }

  function pinta(){
    const f=FILTRO_TEN, t=plano(f.q.trim());
    const vis=casos.filter(c=>
      (!f.region || c.region===f.region) &&
      (!f.nivel  || c.nivel===f.nivel)   &&
      (!f.via    || c.via===f.via)       &&
      (!f.res    || c.resultado===f.res) &&
      (!t || plano(`${c.nombre} ${c.distrito} ${c.provincia} ${c.region} ${c.organizacion_2026} ${c.organizacion_2022}`).includes(t)));
    $('t-filas').innerHTML = vis.length ? vis.map(fila).join('')
      : `<tr><td colspan="5" class="sub" style="padding:16px;text-align:center">Nada coincide.</td></tr>`;
    $('t-cuenta').textContent=`${F(vis.length)} de ${F(casos.length)} casos`;
  }

  // El estado de los filtros sobrevive al repintado del sondeo: cada 45 segundos
  // la vista se vuelve a armar, y perder lo que el lector había filtrado hace la
  // página inservible justo la noche en que más se usa.
  const liga=(id,campo)=>{ const el=$(id); el.value=FILTRO_TEN[campo];
    el.oninput=el.onchange=()=>{ FILTRO_TEN[campo]=el.value; pinta(); }; };
  liga('tq','q'); liga('t-reg','region'); liga('t-niv','nivel');
  liga('t-via','via'); liga('t-res','res');
  pinta();
}

// Buscar por nombre es el mismo control en dos sitios —arriba del resumen y en
// la pestaña del buscador—, así que se declara una vez y se engancha donde haga
// falta. Devuelve el HTML; `enchufaBuscar` le pone el comportamiento.
function bloqueBuscar(titulo){
  return `<h2>${titulo||'Por nombre'}</h2>
    <input class="buscar" id="q" placeholder="Escribe un distrito, provincia o región…"
      autocomplete="off" aria-label="Buscar por nombre">
    <div class="res" id="res" hidden></div>`;
}
// Dónde queda cada circunscripción. Los nombres de provincia y departamento no
// están en `meta.json`, pero no hacen falta ahí: las carreras de gobernador dan
// los 25 departamentos y las provinciales las 196 provincias, y el ubigeo de un
// distrito lleva dentro los dos prefijos. Se deriva de lo que ya está cargado.
//
// Hace falta porque el nombre solo no identifica: hay dos SAN ISIDRO —uno en
// Huaytará, Huancavelica y otro en Lima— y la lista los mostraba idénticos, así
// que elegir entre ellos era adivinar.
let _ambito=null;
function ambito(){
  if(_ambito) return _ambito;
  const dep={}, prov={};
  for(const c of (META.carreras||[])){
    if(c.tipo==='01') dep[c.ubigeo.slice(0,2)]=c.nombre;
    else if(c.tipo==='03') prov[c.ubigeo.slice(0,4)]=c.nombre;
  }
  return (_ambito={dep, prov});
}
function donde(c){
  const {dep, prov}=ambito(), u=c.ubigeo||'';
  // Una provincia no se sitúa dentro de sí misma, ni un departamento dentro de
  // nada: solo se nombra el ámbito que está por encima.
  const partes = c.tipo==='04' ? [prov[u.slice(0,4)], dep[u.slice(0,2)]]
               : c.tipo==='03' ? [dep[u.slice(0,2)]]
               : [];
  return partes.filter(x=>x && x!==c.nombre).join(', ');
}

function enchufaBuscar(carreras, foco){
  const q=$('q'), res=$('res');
  if(!q) return;
  if(BUSQUEDA) q.value=BUSQUEDA;
  const busca=()=>{
    BUSQUEDA=q.value;
    const t=q.value.trim().toLowerCase();
    if(t.length<2){ res.hidden=true; return }
    const hits=carreras.filter(c=>c.nombre.toLowerCase().includes(t)).slice(0,60);
    res.innerHTML=hits.length?hits.map(c=>{
      const d=donde(c);
      return `<a href="#/c/${c.race_id}">
        <b>${esc(c.nombre)}</b> <span class="sub">· ${NIVEL[c.tipo]||c.tipo}${
          d?` · ${esc(d)}`:''}</span></a>`;
    }).join('')
      :`<a class="sub" style="cursor:default">Nada coincide.</a>`;
    res.hidden=false;
  };
  q.oninput=busca; if(BUSQUEDA) busca();
  if(foco) q.focus();
}

// ------------------------------------------------------------ vista: buscador
// Dos caminos a la misma página, porque la gente busca de dos maneras: quien
// sabe cómo se llama su distrito lo escribe; quien no, baja por la jerarquía.
async function vistaBuscador(){
  const TIPOS=[['01','Gobernador regional'],['03','Alcaldía provincial'],
               ['04','Alcaldía distrital']];
  const carreras=META.carreras.filter(c=>c.tipo!=='02');
  $('vista').innerHTML=`<h1>Buscador</h1>
    <div class="sub">${F(carreras.length)} elecciones</div>

    ${bloqueBuscar()}

    <h2>Por circunscripción</h2>
    <div class="casc">
      <label>Tipo de elección<select id="s-tipo">
        ${TIPOS.map(([t,l])=>`<option value="${t}">${l}</option>`).join('')}</select></label>
      <label>Departamento<select id="s-dep"></select></label>
      <label id="l-prov">Provincia<select id="s-prov"></select></label>
      <label id="l-dist">Distrito<select id="s-dist"></select></label>
    </div>
    <div id="destino"></div>`;

  // --- por nombre
  enchufaBuscar(carreras, true);

  // --- por circunscripción
  // Reconstruir un desplegable borra lo que estaba elegido, y `refresca()` corre
  // en cada cambio: al elegir provincia, el propio refresco la deseleccionaba y
  // el distrito nunca se habilitaba. Se conserva el valor si sigue existiendo.
  const opciones=(sel,items,vacio)=>{
    const antes=sel.value;
    sel.innerHTML=(vacio?`<option value="">${esc(vacio)}</option>`:'')+
      items.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('');
    if(antes && items.some(([v])=>v===antes)) sel.value=antes;
  };
  const unicos=(arr)=>[...new Map(arr).entries()].sort((a,b)=>a[1].localeCompare(b[1],'es'));
  const deps=unicos(META.ambitos.departamentos.map(d=>[d.ubigeo,d.nombre]));
  const sT=$('s-tipo'), sD=$('s-dep'), sP=$('s-prov'), sI=$('s-dist');
  opciones(sD, deps, '—');

  function refresca(){
    const t=sT.value, dep=sD.value;
    $('l-prov').hidden = t==='01';
    $('l-dist').hidden = t!=='04';

    // Cada nivel se llena **siempre**, aunque su padre esté sin elegir: antes
    // el de provincia se quedaba sin una sola opción hasta que se escogía
    // departamento, y un desplegable vacío se lee como que está roto.
    if(t!=='01'){
      const provs = dep ? unicos(carreras.filter(c=>c.tipo==='03' &&
        c.ambitos.departamento===dep).map(c=>[c.ambitos.provincia, c.nombre])) : [];
      opciones(sP, provs, dep ? 'Elige una provincia' : 'Elige un departamento primero');
      sP.disabled = !dep;
    }
    if(t==='04'){
      const dists = sP.value ? unicos(carreras.filter(c=>c.tipo==='04' &&
        c.ambitos.provincia===sP.value).map(c=>[c.ambitos.distrito, c.nombre])) : [];
      opciones(sI, dists, sP.value ? 'Elige un distrito' : 'Elige una provincia primero');
      sI.disabled = !sP.value;
    }

    // La elección queda determinada cuando el último nivel está escogido.
    const clave = t==='01' ? dep : t==='03' ? sP.value : sI.value;
    const c = clave ? carreras.find(x=>x.tipo===t &&
      x.ambitos[t==='01'?'departamento':t==='03'?'provincia':'distrito']===clave) : null;
    const falta = t==='01' ? 'un departamento'
                : t==='03' ? (dep?'una provincia':'un departamento')
                : (!dep?'un departamento':!sP.value?'una provincia':'un distrito');
    $('destino').innerHTML = c
      ? `<a class="ir" href="#/c/${c.race_id}">Ir a ${esc(c.nombre)} →</a>`
      : `<p class="sub">Falta elegir ${falta}.</p>`;
  }
  sT.onchange=refresca;
  sD.onchange=refresca;
  sP.onchange=refresca;
  sI.onchange=refresca;
  refresca();
}

// Render de un cuerpo colegiado. Los escaños van **por bancada**, no en el orden
// en que se adjudicaron: primero el bloque más grande, luego los demás, y al
// final los que siguen en disputa. Así se lee de un vistazo la correlación de
// fuerzas, que es lo que un hemiciclo comunica y una tira desordenada no.
function hemiciclo(bancadas, enDisputa, color){
  const asientos=[];
  for(const b of [...bancadas].sort((x,y)=>y.escanos-x.escanos))
    for(let i=0;i<b.escanos;i++) asientos.push(b);
  for(let i=0;i<enDisputa;i++) asientos.push(null);
  if(!asientos.length) return '';
  const silla=b=>`<span class="silla" title="${esc(b?b.nombre:'EN DISPUTA')}"
      style="${b?`background:${color(b.codigo)};border-color:${color(b.codigo)}`:''}"
      ></span>`;
  // Una sola fila solo para cuerpos muy chicos. El umbral estaba en 9 y dejaba
  // en una tira a casi todos los concejos municipales, que tienen entre 5 y 9
  // escaños: justo los que tenían que verse como hemiciclo.
  if(asientos.length<=6)
    return `<div class="hemi-caja"><div class="hemi">
      <div class="hemi-fila">${asientos.map(silla).join('')}</div></div></div>`;

  // Dos filas, llenadas **por columna**: el escaño 1 arriba, el 2 justo debajo,
  // el 3 en la columna siguiente. Con el llenado por fila una bancada quedaba
  // partida entre el final de arriba y el principio de abajo.
  const arriba=asientos.filter((_,i)=>i%2===0);
  const abajo =asientos.filter((_,i)=>i%2===1);
  // Cada fila se centra por su cuenta. Con un número impar de escaños la de
  // abajo lleva una burbuja menos, y al centrarse queda desplazada medio ancho:
  // las burbujas caen justo en los huecos de la de arriba, que es como se dibuja
  // un hemiciclo y no como una tabla a la que le falta una celda.
  return `<div class="hemi-caja"><div class="hemi">
    <div class="hemi-fila">${arriba.map(silla).join('')}</div>
    <div class="hemi-fila">${abajo.map(silla).join('')}</div></div></div>`;
}

function leyendaBancadas(bancadas, enDisputa, color){
  return `<div class="leyenda" style="border:0;padding:8px 2px;justify-content:center">`+
    [...bancadas].sort((x,y)=>y.escanos-x.escanos).map(b=>
      `<span class="it"><span class="punto" style="background:${color(b.codigo)}"></span>
       ${esc(b.nombre)} · <b>${b.escanos}</b></span>`).join('')+
    (enDisputa>0?`<span class="it"><span class="punto" style="background:var(--vacio);
      border:1px solid var(--linea-fuerte)"></span>EN DISPUTA · <b>${enDisputa}</b></span>`:'')+
    `</div>`;
}

// sentencias, obligaciones, domicilio— ya vienen en el contrato, y depender del
// portal del JNE una noche electoral es exactamente lo que no hay que hacer.
// Misma escala de educación que el buscador de candidatos: máscara de bits.
const EDU=[[1,'Pri','Primaria'],[2,'Sec','Secundaria'],[4,'Téc','Técnica'],
           [8,'Uni','Universitaria'],[16,'Pos','Posgrado']];

let RACE_ACTUAL=null, FICHAS_RAZA={};

             u.concluida?'concluida':'no concluida'].filter(Boolean).join(' · ')})))
        .concat((e.posgrado||[]).map(u=>({t:u.doctor?'Doctorado':(u.maestro?'Maestría':'Posgrado'),
          c:u.centro, d:[u.especialidad, u.anio, u.concluido?'concluido':'no concluido']
            .filter(Boolean).join(' · ')})))
        .concat((e.tecnica||[]).map(u=>({t:'Técnica', c:u.centro,
          d:[u.carrera, u.concluida?'concluida':'no concluida'].filter(Boolean).join(' · ')})))
        .concat((e.no_universitaria||[]).map(u=>({t:'No universitaria', c:u.centro,
          d:[u.carrera, u.concluida?'concluida':'no concluida'].filter(Boolean).join(' · ')})));

      x+=lista('Estudios', estudios, u=>`<div class="fi">

        <b>${esc(u.cargo)}</b><span>${esc(u.organizacion||'')}${

          dato('Renta pública', money(i.renta_publica))+
          dato('Renta privada', money(i.renta_privada))+

      x+=lista('Bienes inmuebles', det.inmuebles, u=>`<div class="fi">

      x+=lista('Bienes muebles', det.muebles, u=>`<div class="fi">
        <b>${esc(u.tipo)}</b><span>${esc(u.detalle||'')}${
          u.valor?' · S/ '+F(Math.round(u.valor)):''}</span></div>`);

    x+=`<p class="sub" style="margin:14px 0 0">Todo lo anterior es **lo declarado

  pinta(undefined);                       // primero lo que ya está en memoria
