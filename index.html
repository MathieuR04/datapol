<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Datapol</title>
  <link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/nav.css">

  <!-- OG / Twitter -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Datapol">
  <meta property="og:title"       content="Datapol">
  <meta property="og:description" content="Inteligencia electoral latinoamericana">
  <meta property="og:url"         content="https://datapol.lat/">
  <meta property="og:image"       content="https://datapol.lat/shared/images/og_home.png">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:site"        content="@KhamaRamaq">
  <meta name="twitter:title"       content="Datapol">
  <meta name="twitter:description" content="Inteligencia electoral latinoamericana">
  <meta name="twitter:image"       content="https://datapol.lat/shared/images/og_home.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f5f0e8;
      --text:  #1a1209;
      --terra: #c4603a;
      --sand:  #d9c9b4;
      --border:#cfc0ab;
    }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', -apple-system, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    /* ── Cards ── */
    .cards {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .card {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .card:last-child { border-right: none; }

    /* Iframe fills 2× the container, then scaled 50% back down */
    .card iframe {
      position: absolute;
      top: 0; left: 0;
      width: 200%;
      height: 200%;
      border: none;
      transform: scale(0.5);
      transform-origin: top left;
      pointer-events: none;
    }

    /* Transparent overlay — captures clicks, shows label on hover */
    .card-link {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 1rem;
    }
    .card-label {
      opacity: 0;
      background: rgba(26,18,9,0.75);
      color: var(--sand);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      padding: 0.35rem 0.8rem;
      border-radius: 3px;
      transition: opacity .2s;
      pointer-events: none;
    }
    .card:hover .card-label { opacity: 1; }

    /* Divider line between cards */
    .card-divider {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Mobile — stack vertically */
    @media (max-width: 640px) {
      html, body { overflow: auto; }
      .cards { flex-direction: column; }
      .card { min-height: 56vh; border-right: none; border-bottom: 1px solid var(--border); }
      .card:last-child { border-bottom: none; }
      .card-label { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Nav — simplified, no election tabs on landing page -->
  <div class="nav">
    <a class="nav-brand" href="/">DATAPOL</a>
    <div class="nav-social">
      <a class="nav-social-link" href="https://x.com/KhamaRamaq" target="_blank" rel="noopener" title="X / Twitter">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
      </a>
      <a class="nav-social-link" href="https://www.linkedin.com/in/mathieu-rojas-egoavil-889a64293/" target="_blank" rel="noopener" title="LinkedIn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <button class="nav-social-link nav-yape-btn" onclick="document.getElementById('yape-modal').style.display='flex'" title="Yape">
        <span class="nav-yape-label">YAPE</span>
      </button>
      <div class="nav-sep" style="margin:0 0.4rem"></div>
      <span class="nav-author">MATHIEU ROJAS</span>
    </div>
  </div>

  <!-- Yape modal -->
  <div id="yape-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(26,18,9,0.6);align-items:center;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
    <div style="background:#f5f0e8;border-radius:12px;padding:1.5rem;text-align:center;max-width:280px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.35)">
      <p style="color:#1a1209;font-family:'Bebas Neue',Arial Black,Arial,sans-serif;font-weight:900;font-size:18px;letter-spacing:.12em;margin-bottom:.75rem">APOYA CON YAPE</p>
      <img src="/shared/images/yape_qr.png" alt="Yape QR" style="width:100%;border-radius:8px;display:block">
      <button onclick="document.getElementById('yape-modal').style.display='none'" style="margin-top:1rem;background:none;border:1px solid #cfc0ab;color:#7a6858;padding:.35rem 1rem;border-radius:4px;cursor:pointer;font-size:12px">Cerrar</button>
    </div>
  </div>

  <!-- Feature cards -->
  <div class="cards">

    <div class="card">
      <iframe src="/electoral/peru/2026eg/segunda-vuelta/"
              title="Perú — 2da Vuelta 2026"
              loading="lazy"
              sandbox="allow-scripts allow-same-origin"></iframe>
      <a class="card-link" href="/electoral/peru/2026eg/segunda-vuelta/">
        <span class="card-label">🇵🇪 Perú — 2da Vuelta &nbsp;→</span>
      </a>
    </div>

    <div class="card">
      <iframe src="/electoral/colombia/2026/primera-vuelta/"
              title="Colombia — 1ra Vuelta 2026"
              loading="lazy"
              sandbox="allow-scripts allow-same-origin"></iframe>
      <a class="card-link" href="/electoral/colombia/2026/primera-vuelta/">
        <span class="card-label">🇨🇴 Colombia — 1ra Vuelta &nbsp;→</span>
      </a>
    </div>

  </div>

</body>
</html>
